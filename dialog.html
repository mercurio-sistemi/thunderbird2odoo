<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Odoo Email Connector</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font: caption;
        padding: 1.5rem;
        margin: 0;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      #message {
        flex: 1;
        margin-bottom: 1.2rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        overflow-y: auto;
      }
      #dialogSelects {
        flex-shrink: 0;
        margin-bottom: 0.5rem;
      }
      .select-row {
        margin-bottom: 0.8rem;
      }
      .select-row label {
        display: block;
        margin-bottom: 0.3rem;
        font-size: 0.85em;
        color: #444;
      }
      .select-row select {
        width: 100%;
        padding: 0.4rem;
        box-sizing: border-box;
      }
      #buttons {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      button {
        padding: 0.5rem 1.2rem;
        min-width: 6rem;
      }
    </style>
  </head>
  <body>
    <p id="message"></p>
    <div id="dialogSelects"></div>
    <div id="buttons"></div>
    <script src="lib/domUtils.js"></script>
    <script src="dialog.js"></script>
  </body>
</html>
